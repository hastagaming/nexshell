# Project-wide Gradle settings for NexShell.

# JVM heap tuned for on-device builds in Termux (limited RAM compared to
# a desktop CI runner). Increase these if building on a machine with more
# memory available; lower them further if the daemon gets OOM-killed.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel and cached builds — helps rebuild times on constrained
# hardware since only changed modules get reprocessed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX is required — this project uses Jetpack Compose and AndroidX
# libraries exclusively, no legacy support library.
android.useAndroidX=true

# Disable Jetifier: nothing in this project depends on legacy
# non-AndroidX libraries, so skipping it saves build time.
android.enableJetifier=false

# Kotlin code style used by IDE formatters that read this project.
kotlin.code.style=official

# Non-transitive R classes: each module only sees its own resources in
# its R class, not a merged R from all dependencies. Faster incremental
# builds, and avoids resource id collisions as NexShell grows more modules.
android.nonTransitiveRClass=true

# Keep native build (CMake/NDK) output verbose enough to diagnose proot
# and PTY native compilation issues without needing --info on every run.
android.native.buildOutput=verbose

# R8 full mode is left at its default (on) — no override needed since
# buildTypes.release.isMinifyEnabled is currently false during active
# development (see app/build.gradle.kts). Flip this project setting's
# relevance once minification is turned on for real release builds.