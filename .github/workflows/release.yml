name: Sign & Release NexShell

on:
  workflow_run:
    workflows: ["Build NexShell"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID dari workflow Build NexShell yang APK-nya mau di-sign (kosongkan jika dipicu otomatis)'
        required: false
        type: string
      tag_name:
        description: 'Tag rilis manual, contoh: v1.2.0 (kosongkan untuk auto-generate)'
        required: false
        type: string
      release_name:
        description: 'Nama rilis manual (kosongkan untuk auto-generate)'
        required: false
        type: string

jobs:
  sign-and-release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for version reference only)
        uses: actions/checkout@v4

      - name: Resolve source run ID
        id: resolve_run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ inputs.build_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tag and release name
        id: resolve_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            NAME="${{ inputs.release_name }}"
          else
            TAG="v0.1.${{ github.run_number }}"
            NAME="NexShell $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"
          # Strip leading "v" for use as Gradle versionName (e.g. v0.1.42 -> 0.1.42)
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download unsigned release APK from build run
        uses: actions/download-artifact@v4
        with:
          name: nexshell-release-unsigned-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve_run.outputs.run_id }}
          path: ./unsigned

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/nexshell-release.jks

      - name: Locate Android build-tools zipalign & apksigner
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV

      - name: Zipalign
        run: |
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
            unsigned/app-release-unsigned.apk \
            nexshell-aligned.apk

      - name: Sign APK with apksigner
        run: |
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks keystore/nexshell-release.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out nexshell-signed-unnamed.apk \
            nexshell-aligned.apk

      - name: Verify signature
        run: |
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose nexshell-signed-unnamed.apk

      - name: Rename APK to include version tag
        id: rename_apk
        run: |
          FINAL_NAME="nexshell-${{ steps.resolve_tag.outputs.tag }}.apk"
          mv nexshell-signed-unnamed.apk "$FINAL_NAME"
          echo "apk_path=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean up keystore file
        if: always()
        run: rm -f keystore/nexshell-release.jks

      - name: Create GitHub Release and upload signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.release_name }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
