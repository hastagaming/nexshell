name: Sign & Release NexShell

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID dari workflow Build NexShell yang APK-nya mau di-sign'
        required: true
        type: string
      tag_name:
        description: 'Tag rilis, contoh: v0.1.0'
        required: true
        type: string
      release_name:
        description: 'Nama rilis'
        required: true
        type: string

jobs:
  sign-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Download unsigned release APK from previous build run
        uses: actions/download-artifact@v4
        with:
          name: nexshell-release-unsigned-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
          path: ./unsigned

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/nexshell-release.jks

      - name: Locate Android build-tools zipalign & apksigner
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV

      - name: Zipalign
        run: |
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
            unsigned/app-release-unsigned.apk \
            nexshell-aligned.apk

      - name: Sign APK with apksigner
        run: |
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks keystore/nexshell-release.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out nexshell-signed.apk \
            nexshell-aligned.apk

      - name: Verify signature
        run: "$BUILD_TOOLS_DIR/apksigner" verify --verbose nexshell-signed.apk

      - name: Clean up keystore file
        if: always()
        run: rm -f keystore/nexshell-release.jks

      - name: Create GitHub Release and upload signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          files: nexshell-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}